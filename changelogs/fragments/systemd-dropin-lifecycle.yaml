bugfixes:
- reload the systemd units in the same task that restarts the service. A restart can no longer run against a unit systemd has not read, and a host left with a drop-in systemd never loaded is repaired by the next change instead of restarting onto the stale unit (https://github.com/PowerDNS/pdns_recursor-ansible/pull/267).
- reload the systemd units in the service task when this run changed the drop-in. Handlers flush at the end of the play, so a service that was not running yet was started from the unit systemd had loaded before the run and kept the previous settings until the handler restarted it (https://github.com/PowerDNS/pdns_recursor-ansible/pull/267).
- remove ``/etc/systemd/system/<service name>.service.d/`` when ``pdns_rec_package_state`` is ``absent``, so a later reinstall does not inherit the overrides of the previous installation. The task is tagged ``install``, because removal runs through the install path (https://github.com/PowerDNS/pdns_recursor-ansible/pull/267).
- remove ``/etc/systemd/system/<service name>.service.d/override.conf`` when the merged service overrides are empty, and restart the service. The file used to stay on disk, so emptying ``pdns_rec_service_overrides`` kept the previous overrides applied forever. Other drop-ins in that directory are left alone (https://github.com/PowerDNS/pdns_recursor-ansible/pull/267).
- write the drop-in from the same value the template renders. The task was skipped on an empty ``pdns_rec_service_overrides`` while the template renders the merge of that variable with the platform defaults. No shipped platform sets a default override today, so this was latent, but a default added later would not have reached the unit (https://github.com/PowerDNS/pdns_recursor-ansible/pull/267).
doc_changes:
- document the drop-in removal, the reload behaviour of the restart handler and that tag selection filters tasks but not handlers, so ``--skip-tags service`` still restarts the service on a configuration change (https://github.com/PowerDNS/pdns_recursor-ansible/pull/267).
