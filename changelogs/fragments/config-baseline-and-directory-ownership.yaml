breaking_changes:
- restrict ``incoming.allow_from`` to ``127.0.0.0/8``. The recursor's own default is the RFC 1918 set plus loopback and link-local (``10.0.0.0/8``, ``100.64.0.0/10``, ``169.254.0.0/16``, ``192.168.0.0/16``, ``172.16.0.0/12``, ``::1/128``, ``fc00::/7``, ``fe80::/10``), and the baseline now replaces it rather than adding to it, because ``ansible.builtin.combine`` overwrites a list instead of merging it. A deployment that relies on the default to serve clients on a private range therefore starts refusing them after this upgrade, and one that serves IPv6 loses ``::1/128``. Declare the ranges the host should answer for in ``pdns_rec_config.incoming.allow_from`` (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).

bugfixes:
- restore ``recursor.setuid`` and ``recursor.setgid`` in the configuration the role writes. They were dropped when the configuration moved to the ``pdns_rec_config`` dictionary, so the file no longer told the recursor to drop privileges and a start that does not come from the packaged unit - a hand-written unit, an ``ExecStart`` override installed through ``pdns_rec_service_overrides``, or a run outside systemd - left the daemon running as the account that launched it (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).
- keep ``recursor.include_dir`` in the configuration the role writes. The role writes over the file the packages ship, which declares it, so the directory an operator keeps drop-ins in was no longer read (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).
- create the directories named by ``recursor.include_dir`` and ``webservice.api_dir``. The recursor reads that setting whether or not the webserver is enabled and exits with ``No such file or directory`` when the directory is absent, so a configuration that set it without also listing the directory in ``pdns_rec_config_additional_dirs`` left the daemon unable to start. The same is true of ``recursor.include_dir``, which the baseline now declares. The API directory is owned by ``pdns_rec_user``, because the REST API writes into it (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).
- stop marking supplementary files executable. ``pdns_rec_config_additional_files`` were written with mode ``0750``, which is meaningless for files the recursor only ever reads, such as RPZ zones and include fragments. They are now written with ``pdns_rec_config_file_mode``, ``0640`` by default (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).
minor_changes:
- apply the owner, group and mode of every ``pdns_rec_config_additional_dirs`` entry to the whole tree, so a file another role or the recursor itself placed there stays readable by the account the daemon runs as. ``pdns_rec_config_dirs_recurse`` turns it off, globally or per entry through a ``recurse`` key. Symlinks are not followed, so a link inside one of these directories - an RPZ zone kept on shared storage, say - cannot turn the recursion into a chown and chmod of whatever it points at. Three directories are never walked: the configuration directory, because it holds the ``recursor.yml-dist`` of the package; the directory named by ``recursor.include_dir``, because it holds the operator's drop-ins; and the one named by ``webservice.api_dir``, because its contents are state the daemon rewrites (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).
- add ``pdns_rec_config_dir_mode`` and ``pdns_rec_config_file_mode``. The directory mode is symbolic, ``u=rwX,g=rX,o=``, so that the capital ``X`` grants execute on directories, and on files that already carry it, but never marks a plain RPZ zone or include fragment executable (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).
- add ``incoming.reuseport``, ``outgoing.source_address``, ``recursor.extended_resolution_errors``, ``recursor.threads`` and ``recursor.max_mthreads`` to the baseline configuration the role merges ``pdns_rec_config`` over (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).
doc_changes:
- document the baseline configuration, the placement of ``threads`` and ``max_mthreads`` under ``recursor`` rather than ``outgoing``, and the settings needed to enable the REST API (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).
- document that ``pdns_rec_user`` and ``pdns_rec_group`` have to name the account the service starts as, now that they are written to the configuration as ``setuid`` and ``setgid``. The packaged units already agree with them; an override that changes ``User=``, ``Group=`` or ``ExecStart`` has to change them with it, because a daemon asked to become an account other than the one it was started as exits rather than continue with the wrong privileges (https://github.com/PowerDNS/pdns_recursor-ansible/pull/268).
