---

# By default the PowerDNS Recursor is installed from the os default repositories.
# This setting has no effect on FreeBSD
pdns_rec_install_repo: ""

# Install the EPEL repository.
# EPEL is needed to satisfy some PowerDNS Recursor dependencies like protobuf
pdns_rec_install_epel: true

# You can install the PowerDNS Recursor package from the 'master' branch as
# follows:
# - hosts: all
#   roles:
#    - { role: PowerDNS.pdns_recursor,
#        pdns_rec_install_repo: "{{ pdns_rec_powerdns_repo_master }}"
#
# To install the PowerDNS Recursor package from the '54' branch of
# the PowerDNS official repository use the following playbook
# - hosts: all
#   roles:
#    - { role: PowerDNS.pdns_recursor,
#        pdns_rec_install_repo: "{{ pdns_rec_powerdns_repo_54 }}"
#
# To install the PowerDNS Recursor package from a custom repository
# override the `pdns_rec_install_repo` default value in your playbook.
# e.g.
# - hosts: all
#   vars:
#     pdns_rec_install_repo:
#       apt_repo_origin: "repo.example.com"  # used to pin the pdns-recursor to the provided repository
#       apt_version: "rec-53"                # deb822 suites suffix (appended to release codename)
#       gpg_key: "http://repo.example.com/MYREPOGPGPUBKEY.asc" # repository public GPG key
#       yum_repo_baseurl: "http://repo.example.com/centos/$basearch/$releasever/pdns-recursor"
#       yum_debug_symbols_repo_baseurl: "http://repo.example.com/centos/$basearch/$releasever/pdns-recursor/debug"
#       yum_repo_name: "powerdns-rec"   # used to select only the pdns-recursor packages coming from this repo
#   roles:
#    - { role: PowerDNS.pdns_recursor }

# The name of the PowerDNS package
pdns_rec_package_name: "{{ default_pdns_rec_package_name }}"
pdns_rec_package_version: ""

# The desired state of the PowerDNS Recursor packages.
# Use "present" (default) to install, "latest" to upgrade, or "absent" to uninstall.
pdns_rec_package_state: "present"

# Install PowerDNS Recursor debug symbols package
pdns_rec_install_debug_symbols_package: false

# The name of the PowerDNS Recursor debug symbols package
pdns_rec_debug_symbols_package_name: "{{ default_pdns_rec_debug_symbols_package_name }}"

# The user and group the PowerDNS Recursor will run as.
# NOTE: This role does not create any user as we assume the "pdns" user and group
# to be created by the PowerDNS Recursor package or by an other role.
# If you change these variables, make sure to create the user and groups before
# applying this role
pdns_rec_user: "{{ default_pdns_rec_user }}"
pdns_rec_group: "{{ default_pdns_rec_group }}"

# The user and group that own the configuration files
pdns_rec_file_owner: root
pdns_rec_file_group: "{{ default_pdns_rec_file_group }}"

# Name of the PowerDNS Service
pdns_rec_service_name: "{{ default_pdns_rec_service_name | default('pdns-recursor') }}"
# Name of the PowerDNS binary.
pdns_rec_bin_name: pdns_recursor

# Absolute path of the daemon, used for the configuration check.
pdns_rec_bin_path: "{{ default_pdns_rec_bin_path | default('/usr/sbin/' ~ pdns_rec_bin_name) }}"

# State of the PowerDNS Recursor service
pdns_rec_service_state: started
pdns_rec_service_enabled: true
pdns_rec_service_masked: false

# When true, disable the automated restart of the PowerDNS Recursor service
pdns_rec_disable_handlers: false

# When true, run the notified handlers at the end of the role instead of at the
# end of the play. Set this when the role runs more than once in a play.
pdns_rec_flush_handlers: false

# Configuration directory and files
pdns_rec_config_dir: "{{ default_pdns_rec_config_dir }}"
pdns_rec_config_file: recursor.conf

# Additional directories for configuration or supplementary files
pdns_rec_config_additional_dirs: []

# Additional configuration or supplementary files
pdns_rec_config_additional_files: []

# Whether the owner, group and mode of the additional directories are applied to
# their whole tree. The recursor reads the files that end up in them - RPZ zones,
# an include_dir fragment, the API state - so they have to be readable by the
# account the daemon runs as, whatever created them.
#
# This covers pdns_rec_config_additional_dirs and the directory named by
# webservice.api_dir. The configuration directory itself is never walked: it
# belongs to the package, which ships a recursor.yml-dist in it, and to the
# operator, whose drop-ins live in recursor.d.
pdns_rec_config_dirs_recurse: true

# Mode of the additional directories, applied to the whole tree when
# pdns_rec_config_dirs_recurse is enabled.
#
# It is deliberately symbolic rather than numeric: the capital `X` in `u=rwX`
# grants the execute bit on directories, and on files that already carry one,
# but never adds it to a file that does not. So the directories stay traversable
# while an RPZ zone or an include fragment is left non-executable, which is all
# the recursor needs - it reads those files and never runs them. A numeric mode
# cannot draw that line, since `0750` applied to a tree marks every file
# executable as well, so an override should be symbolic too.
#
# The default is the equivalent of 0750 on directories and 0640 on files, which
# is what pdns_rec_config_file_mode sets on a file of its own.
pdns_rec_config_dir_mode: "u=rwX,g=rX,o="

# Mode of the additional configuration or supplementary files.
#
# Keep this in step with the file half of pdns_rec_config_dir_mode. When the two
# disagree and a file lives inside one of the directories above, each converge
# ends up rewriting the mode twice and never reports an unchanged run.
pdns_rec_config_file_mode: "0640"

# Example config from:
# https://doc.powerdns.com/recursor/yamlsettings.html#yaml-settings-file
pdns_rec_config: {}
#   dnssec:
#     log_bogus: true
#   incoming:
#     listen:
#       - 0.0.0.0:5301
#       - '[::]:5301'
#   recursor:
#     extended_resolution_errors: true
#     forward_zones:
#       - zone: example.com
#         forwarders:
#           - 127.0.0.1:5301
#   outgoing:
#     source_address:
#       - 0.0.0.0
#       - '::'
#   logging:
#     loglevel: 6

# Dict with overrides for the service (systemd only)
pdns_rec_service_overrides: {}
#   Service:
#     User: "{{ pdns_rec_user }}"
#     Group: "{{ pdns_rec_group }}"

pdns_rec_install_repo_name: powerdns-recursor
pdns_rec_install_repo_regex: "{{ '^' + pdns_rec_install_repo_name + '\\.(list|sources|repo|asc)$' }}"
pdns_rec_remove_versioned_repo_regex: '^powerdns-rec-(master|\d+)\.(list|sources|repo|asc)$'
pdns_rec_remove_versioned_repo_files: true
