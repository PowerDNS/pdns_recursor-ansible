---
# The dns/powerdns-recursor port is installed through pkg, which selects a
# version as a `-<version>` suffix on the package name. The version has to be one
# the configured pkg repository carries: the FreeBSD release repositories keep a
# single version per package, so a pin is only useful against a repository that
# serves several, for instance a poudriere built one.
#
# FreeBSD ships no debug symbols package, and vars/FreeBSD.yml sets
# default_pdns_rec_debug_symbols_package_name to an empty string for it, which
# skips that install.
- name: Install the PowerDNS Recursor packages
  tags:
    - install
  block:
    - name: Prefix the version of the PowerDNS Recursor package with the correct separator
      ansible.builtin.set_fact:
        _pdns_rec_package_version: -{{ pdns_rec_package_version }}
      when: pdns_rec_package_version | length > 0

    - name: Install the PowerDNS Recursor
      ansible.builtin.package:
        name: "{{ pdns_rec_package_name }}{{ _pdns_rec_package_version | default('') }}"
        state: "{{ pdns_rec_package_state }}"

    - name: Install PowerDNS Recursor debug symbols
      ansible.builtin.package:
        name: "{{ pdns_rec_debug_symbols_package_name }}{{ _pdns_rec_package_version | default('') }}"
        state: "{{ pdns_rec_package_state }}"
      when:
        - pdns_rec_install_debug_symbols_package | bool
        - pdns_rec_debug_symbols_package_name | length > 0
