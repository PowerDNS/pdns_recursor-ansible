---

# Every instance is configured in the same play. Handlers are shared between
# role invocations, so every invocation flushes its own handlers.
- name: PowerDNS Recursor multiple instances in a single play
  hosts: all
  become: true
  vars_files:
    - ../resources/vars/pdns-rec-version.yml
    - ../resources/vars/pdns-rec-instances.yml
  tasks:

    - name: Configure the recursor instances
      ansible.builtin.include_tasks: ../resources/tasks/pdns-rec-instance.yml
      loop: "{{ pdns_rec_multi_instances }}"
      loop_control:
        loop_var: instance
        label: "{{ instance.name }}"
