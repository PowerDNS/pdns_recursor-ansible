---

##
# Platforms for PowerDNS Recursor 5.2, run with the ansible220 tox environment.
#
# One platform per packaging family rather than the full operating system matrix.
# What changes from one release of the recursor to the next is the upstream
# repository path and which packages exist for it, and a single RPM host plus a
# single DEB host establish both. The role logic that does vary per operating
# system is covered in full by the set of the newest release, pdns-rec-54.yml,
# where every supported operating system still runs.
#
# The other platforms are commented out rather than removed: they are what this
# set used to run, so widening this release back to the full matrix is a matter
# of uncommenting them.
#
# Only operating systems that upstream publishes pdns-rec-52 packages for are listed.
# Enterprise Linux 8 and Ubuntu 20.04 live in pdns-rec-52-ansible216.yml instead,
# because their Python needs ansible-core 2.16.
##

platforms:

  - name: oraclelinux-9
    image: oraclelinux:9
    dockerfile_tpl: el-systemd

  - name: debian-12
    image: debian:12
    dockerfile_tpl: debian-systemd

