---

##
# Platforms for PowerDNS Recursor 5.4, the newest release, run with the
# ansible220 tox environment. This is the one set that carries the full operating
# system matrix: the sets of the older releases run a single RPM host and a single
# DEB host, because what differs between releases is the upstream repository
# rather than the role logic.
#
# Only operating systems that upstream publishes pdns-rec-54 packages for are listed.
# Ubuntu 26.04 is absent because upstream publishes no resolute packages for the
# recursor. Enterprise Linux 8 and Ubuntu 20.04 live in pdns-rec-54-ansible216.yml
# instead, because their Python needs ansible-core 2.16.
##

platforms:

  - name: rockylinux-9
    image: rockylinux:9
    dockerfile_tpl: el-systemd

  # Oracle Linux 9 is commented out because Rocky Linux 9 above covers the
  # Enterprise Linux 9 code path, and where Oracle diverges from Rocky - EPEL
  # handling and its own repository layout - it is still exercised on Oracle
  # Linux 8 and 10 in this same matrix, and on Oracle Linux 9 in the sets of the
  # older releases. Uncomment to test both EL9 vendors on the newest release.
  # - name: oraclelinux-9
  #   image: oraclelinux:9
  #   dockerfile_tpl: el-systemd

  - name: rockylinux-10
    image: rockylinux/rockylinux:10
    dockerfile_tpl: el-systemd

  - name: oraclelinux-10
    image: oraclelinux:10
    dockerfile_tpl: el-systemd

  - name: debian-11
    image: debian:11
    dockerfile_tpl: debian-systemd

  - name: debian-12
    image: debian:12
    dockerfile_tpl: debian-systemd

  - name: debian-13
    image: debian:13
    dockerfile_tpl: debian-systemd

  - name: ubuntu-2204
    image: ubuntu:22.04
    dockerfile_tpl: debian-systemd

  - name: ubuntu-2404
    image: ubuntu:24.04
    dockerfile_tpl: debian-systemd
